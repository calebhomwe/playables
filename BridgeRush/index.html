       font:900 12px/1.2 var(--gk-body);letter-spacing:.12em;text-transform:uppercase;pointer-events:none}

<script type="module">
import {THREE,setLook,createView,makeSky,makeLights,toon,Particles,Props,Actor,loadMany,loadFrames,mat,frameMeter} from '../lib3d/p3d.js';
import {GK} from '../lib3d/gk.js';
setLook('warm');   /* golden-hour standard materials, no ink outlines (p3d.js) */
try{ document.fonts.load("900 64px Nunito"); }catch(e){}
(()=>{ 'use strict';
/* ═══════════════ BRIDGE RUSH — bridge-builder racer ═══════════════
   Fully offline single file. Canvas 2D, no assets, no network.
   Loop: you auto-run right toward the finish flag. Floating material tops
   up your counter. Gaps in the deck can only be crossed by SPENDING
   material to lay bridge segments; run dry over a gap and you fall.
   Cones knock material loose (hop them). A rival builder races the parallel
   span — score = distance + finish placement. Every run terminates: the
   material economy tightens and wide gaps outrun a careless wallet. */
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a,b)=>a+Math.random()*(b-a);
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
             set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ── Caleb's Arcade SDK glue: pause menu, scenes, codes. Every call is guarded, so the game
   still runs on its own if the SDK script cannot load (then its own pause screen is used). */
const SDK=window.ArcadeSDK||null;
const sdkState=(scene,score)=>{ try{ SDK&&SDK.state(score==null?{scene}:{scene,score}); }catch(e){} };
const RMQ=window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
const calm=()=>!!(RMQ&&RMQ.matches);          /* reduced motion: no screen shake, no flashes */
const CODES={LUMBERYARD:'Planks cost nothing: every gap bridges itself',SLOWRIVAL:'The rival builder works at three-quarter speed',STEELTOES:'Cones cost no material and never trip you'};
const cheat={}; for(const k in CODES)cheat[k]=false;
/* Graphics: High renders at the screen's pixel ratio (up to 2x), Low at 1x for slower phones. */
let GFX_LOW=false; try{ GFX_LOW=localStorage.getItem('br_gfx')==='low'; }catch(e){}
const codesOn=()=>!!((SDK&&SDK.cheated)||Object.keys(cheat).some(k=>cheat[k]));
function codeOn(code){ code=String(code||'').trim().toUpperCase();
  if(!CODES[code])return null; cheat[code]=true; document.getElementById('codesOn').hidden=false; return code; }
let REC=store.get('br_rec',{games:0,best:0,bestDist:0,material:0,segs:0,finishes:0,wins:0,dist:0});
/* ── progression: races with stars, worlds, bridge styles, a daily goal ('bridge-rush-prog-v1', the kit) ── */
const ic=(n,px)=>GK.icon(n,px);
const SKINS=[
  {id:'oak',    name:'Oak',     css:'linear-gradient(90deg,#d8a866 0 30%,#c58a4a 30% 60%,#d8a866 60%)', c:['#ffffff','#ffe2b8'],cost:0},
  {id:'birch',  name:'Birch',   css:'linear-gradient(90deg,#f5ecd8 0 30%,#e2d2b4 30% 60%,#f5ecd8 60%)', c:['#f6efe0','#e8d8ba'],cost:{stars:3}},
  {id:'walnut', name:'Walnut',  css:'linear-gradient(90deg,#8a6a50 0 30%,#6f5240 30% 60%,#8a6a50 60%)', c:['#9a7a60','#7f6048'],cost:{coins:60}},
  {id:'cherry', name:'Cherry',  css:'linear-gradient(90deg,#e08a70 0 30%,#c9705a 30% 60%,#e08a70 60%)', c:['#f0a088','#d98670'],cost:{coins:110}},
  {id:'teal',   name:'Teal',    css:'linear-gradient(90deg,#6fc0b8 0 30%,#4ea59c 30% 60%,#6fc0b8 60%)', c:['#7ecdc4','#5ab0a8'],cost:{level:5}},
  {id:'navy',   name:'Navy',    css:'linear-gradient(90deg,#5a7fb8 0 30%,#456a9f 30% 60%,#5a7fb8 60%)', c:['#6a90c8','#4f78b0'],cost:{stars:10}},
  {id:'sunny',  name:'Sunny',   css:'linear-gradient(90deg,#ffd35c 0 30%,#f0b33a 30% 60%,#ffd35c 60%)', c:['#ffe07a','#f5c04a'],cost:{streak:3}},
  {id:'rose',   name:'Rose',    css:'linear-gradient(90deg,#f0a0b8 0 30%,#dc8aa2 30% 60%,#f0a0b8 60%)', c:['#f6b0c6','#e496ae'],cost:{stars:18}},
  {id:'slate',  name:'Slate',   css:'linear-gradient(90deg,#8a90a0 0 30%,#727888 30% 60%,#8a90a0 60%)', c:['#9aa0b0','#7e8494'],cost:{coins:250}},
];
const WORLDS=[
  {name:'Harbour Works',sea:'#ffffff'},{name:'Estuary Crossing',sea:'#d8f0ff'},{name:'Iron Coast',sea:'#e0e8f0'},{name:'Skyline Span',sea:'#c8d8f0'},{name:'Night Crossing',sea:'#b0c0e0'},
];
const PROG=GK.progress('bridge-rush',{perWorld:5,worlds:WORLDS,skins:SKINS,dailyReward:60,
  daily:[
    {id:'gaps', icon:'flag',  text:n=>'Cross '+n+' gaps',            targets:[12,20,30]},
    {id:'wood', icon:'plank', text:n=>'Collect '+n+' material',       targets:[20,35,55]},
    {id:'wins', icon:'trophy',text:n=>'Win '+n+' races',              targets:[1,2,3]},
    {id:'runs', icon:'bolt',  text:n=>'Finish '+n+' runs',            targets:[2,3,5]},
  ]});
let MODE=PROG.d.mode==='classic'?'classic':'level';
let LEVEL=Math.min(PROG.d.level,PROG.d.pick||PROG.d.level);
let SPEC=null;
function levelSpec(L){ return {L,finish:Math.min(620,220+55*(L-1)),lay:clamp(0.34-0.012*(L-1),0.20,0.34),margin:Math.min(30,12+2*L)}; }
function applySkin(){ const sk=PROG.current(); plankTint[0].set(sk.c[0]); plankTint[1].set(sk.c[1]); }

/* palette: warm site timber + galvanised steel + hi-vis safety yellow, on a
   blueprint-dusk sky. High contrast, flat shapes, nothing muddy. */
const P={ink:'#151009',deep:'#1f1810',paper:'#fbf3e4',cream:'#efe1c6',
  wood:'#c58a4a',wood2:'#8f5f31',woodL:'#eabf82',woodD:'#6b4a26',
  steel:'#9fb0c2',steelD:'#5c6b7a',steelL:'#dbe6f0',
  hivis:'#ffd21e',orange:'#ff7a1a',rust:'#c24a2a',grime:'#3a2f26',
  dark:'#241c12'};
const DFONT="Nunito,'Arial Black',Impact,sans-serif";

/* legs of the race: the world visibly travels as the finish approaches */
const LEG_NAMES=['Groundworks','Pier Run','Truss Span','High Steel','Sky Bridge'];

const RC={};
function rgb(c){ if(RC[c])return RC[c]; let o=[0,0,0];
  if(c.charAt(0)==='#')o=[parseInt(c.slice(1,3),16),parseInt(c.slice(3,5),16),parseInt(c.slice(5,7),16)];
  else{const m=c.match(/-?\d+/g); if(m)o=[+m[0],+m[1],+m[2]];}
  if(c.charAt(0)==='#')RC[c]=o; return o; }
function mix(a,b,t){const A=rgb(a),B=rgb(b);
  return 'rgb('+Math.round(lerp(A[0],B[0],t))+','+Math.round(lerp(A[1],B[1],t))+','+Math.round(lerp(A[2],B[2],t))+')';}
function withA(c,a){const C=rgb(c);return 'rgba('+C[0]+','+C[1]+','+C[2]+','+a+')';}

/* sky: dawn-to-blueprint lerp across the whole race */
const SKY=[{top:'#3b6ea5',bot:'#f6d3a0',haze:'#f5b673',far:'#a9855a',near:'#8f6a3f',deck:'#6b4a26',star:0},
           {top:'#4a6fa8',bot:'#f3c08a',haze:'#f2a865',far:'#9a7a58',near:'#7d6038',deck:'#5c3f22',star:0},
           {top:'#4c6ea0',bot:'#a9c7de',haze:'#8fb6d8',far:'#5d7893',near:'#405a73',deck:'#3a2f26',star:.16},
           {top:'#1d2b45',bot:'#5a7593',haze:'#7d9cc0',far:'#334a63',near:'#233a52',deck:'#2a2119',star:.55},
           {top:'#0d1526',bot:'#2b3f5c',haze:'#4a6d94',far:'#1f2f45',near:'#141f30',deck:'#1d1710',star:1}];
function skyNow(){ const c=clamp(state.dist/FINISH_DIST*2.5,0,SKY.length-1);   /* golden hour, dusk, blue hour across a race */
  const i=Math.floor(c),t=c-i,j=Math.min(i+1,SKY.length-1),A=SKY[i],B=SKY[j];
  return {top:mix(A.top,B.top,t),bot:mix(A.bot,B.bot,t),haze:mix(A.haze,B.haze,t),
    far:mix(A.far,B.far,t),near:mix(A.near,B.near,t),deck:mix(A.deck,B.deck,t),
    star:lerp(A.star,B.star,t),c};}

/* ── audio: oscillators + one generated noise buffer. Zero asset files. ── */
const AU={ctx:null,on:store.get('br_snd',true),master:null,nb:null,
  init(){
    if(this.ctx){ if(this.ctx.state==='suspended')this._resume(); return; }
    try{ const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      const c=new AC(); this.ctx=c;
      this.master=c.createGain(); this.master.gain.value=.5; this.master.connect(c.destination);
      const len=Math.floor(c.sampleRate*.5),b=c.createBuffer(1,len,c.sampleRate),d=b.getChannelData(0);
      for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
      this.nb=b;
    }catch(e){ this.ctx=null; }
    this._resume();
  },
  _resume(){ try{ const p=this.ctx.resume(); if(p&&p.catch)p.catch(()=>{}); }catch(e){} },
  tone(f,dur,type,vol,slide,delay){ if(!this.on||!this.ctx)return;
    const c=this.ctx,t=c.currentTime+(delay||0),o=c.createOscillator(),g=c.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
    if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(24,f*slide),t+dur);
    g.gain.setValueAtTime(.0001,t); g.gain.linearRampToValueAtTime(vol,t+.008);
    g.gain.exponentialRampToValueAtTime(.0006,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+.06); },
  noise(dur,vol,f0,f1,q,delay){ if(!this.on||!this.ctx||!this.nb)return;
    const c=this.ctx,t=c.currentTime+(delay||0),s=c.createBufferSource();
    s.buffer=this.nb; s.loop=true;
    const bp=c.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1.1;
    bp.frequency.setValueAtTime(f0,t); bp.frequency.exponentialRampToValueAtTime(Math.max(60,f1),t+dur);
    const g=c.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0006,t+dur);
    s.connect(bp); bp.connect(g); g.connect(this.master); s.start(t); s.stop(t+dur+.06); },
  /* hammer tap + plank snap on every segment laid */
  lay(n){ const b=300*Math.pow(2,Math.min(n,12)/15);
    this.noise(.06,.16,2600,900,2.6); this.tone(b,.09,'square',.12,1.5);
    this.tone(b*0.5,.14,'triangle',.1); },
  pop(n){ const b=560*Math.pow(2,Math.min(n,16)/14);
    this.tone(b,.14,'triangle',.16); this.tone(b*2.02,.1,'sine',.08,1,.01);
    this.noise(.06,.07,2400,6400,2.6); },
  hop(){ this.tone(320,.13,'square',.09,3.0); this.noise(.08,.06,900,2600,1.1); },
  land(){ this.tone(120,.09,'triangle',.1); this.noise(.07,.05,620,180,1.4); },
  hit(){ this.noise(.36,.28,1800,200,.7); this.tone(150,.4,'sawtooth',.14,.3);
    for(let i=0;i<5;i++)this.noise(.05,.12-i*.02,3600-i*420,700-i*80,3.0,i*.045); },
  low(){ this.tone(180,.1,'square',.06); },
  taunt(){ this.tone(300,.16,'sawtooth',.09,.6); this.tone(360,.16,'square',.06,.55,.14); },
  fall(){ this.noise(.7,.34,1500,120,.7); this.tone(180,.7,'sawtooth',.16,.25);
    this.tone(90,.85,'square',.12,.3); },
  finish(){ this.noise(.7,.3,500,5000,.6); this.tone(660,.5,'triangle',.14,2);
    [523,659,784,1046,1318].forEach((x,i)=>this.tone(x,.3,'triangle',.12,1,i*.1)); },
  ui(){ this.tone(760,.06,'sine',.08); this.tone(1180,.05,'sine',.04,1,.03); },
  go(){ [523,659,784].forEach((x,i)=>this.tone(x,.2,'triangle',.11,1,i*.06)); },
  over(){ [420,330,262,196].forEach((x,i)=>this.tone(x,.4,'triangle',.12,1,i*.12)); }
};

/* ── 3D view (WebGL) + the 2D overlay canvas for popping text and sparks.
   U = px per world unit at the runner, GY = the deck line on screen, RUN_X = the runner's
   screen x, RY = the rival span's deck line: all refreshed from the 3D camera every frame. ── */
const cv=$('#cv'),ctx=cv.getContext('2d');
const V=createView($('#gl'),{fov:44,far:260,low:GFX_LOW});
const SKY3=makeSky(V,{top:'#3b6ea5',horizon:'#f6d3a0',bottom:'#f5b673',fogNear:46,fogFar:118,sun:'#ffcf94'});
const LIGHT=makeLights(V,{dir:[-0.55,0.55,0.62],shadow:12,hemi:0.85,sunI:3.0,sky:'#9db9de',ground:'#8c5d3f'});
SKY3.u.sunDir.value.set(.6,.18,-1).normalize();

const gaps=[],mats=[],cones=[],parts=[],floats=[];
const rival={dist:0,speed:0,rlad:0,finishT:null,layClock:0,seed:rnd(0,6.3)};

function diffc(){ return clamp(state.dist/SPEED_RAMP,0,1); }
function prog(){ return clamp(state.dist/FINISH_DIST,0,1); }
function speedBase(){ return state.speedPin!=null?state.speedPin:lerp(SPEED0,SPEED1,diffc()); }
function scoreNow(){ return Math.floor(state.dist)+(state.place===1?500:state.place===2?200:0); }
function legIdx(){ return clamp(Math.floor(prog()*5),0,4); }
function legName(){ return LEG_NAMES[legIdx()]; }
function gapSegsNow(){ return clamp(Math.round(lerp(GAPSEG0,GAPSEG1,prog())),1,9); }
function groundNow(){ return lerp(GROUND0,GROUND1,prog()); }
function coneCost(){ return clamp(Math.round(lerp(1,3,prog())),1,3); }
function sortGaps(){ gaps.sort((a,b)=>a.x0-b.x0); }

/* ── the deck: gaps are the only holes; everything else is ground ───── */
function addGapSeg(x0,segs){ const g={x0,x1:x0+segs*SEG_W,lad:x0,rlad:x0,
  bridged:false,rbridged:false,seed:rnd(0,6.3)}; gaps.push(g); return g; }
function dressGround(a,b,n){
  const lo=a+2.2, hi=b-2.2;
  if(hi-lo<3)return;
  const step=(hi-lo)/Math.max(1,n);
  for(let i=0;i<n;i++){ const x=lo+step*(i+.5);
    const high=Math.random()<.4;
    mats.push({x,y:high?rnd(PICK_HIGH-0.25,PICK_HIGH+0.3):rnd(PICK_LOW-0.1,PICK_LOW+0.35),
      got:false,seed:rnd(0,6.3)}); }
  const coneChance=lerp(.14,.62,prog());
  if(Math.random()<coneChance&&hi-lo>7){
    cones.push({x:lo+(hi-lo)*rnd(.35,.7),hit:false,seed:rnd(0,6.3)}); }
}
function planAhead(){
  if(!state.spawner)return;
  let guard=0;
  while(state.nextGapAt<state.dist+AHEAD&&guard++<40){
    const segs=gapSegsNow();
    const income=segs+((prog()<.6)?1:0);
    dressGround(state.prevGroundFrom,state.nextGapAt,income);
    const g=addGapSeg(state.nextGapAt,segs);
    state.prevGroundFrom=g.x1;
    state.nextGapAt=g.x1+groundNow()*rnd(.92,1.08);
  }
}
function resetTrack(){
  gaps.length=0; mats.length=0; cones.length=0;
  state.prevGroundFrom=0; state.nextGapAt=16;
  state.autoClock=0; state.manClock=0;
}
function cullWorld(){
  for(let i=gaps.length-1;i>=0;i--)if(gaps[i].x1<state.dist-10)gaps.splice(i,1);
  for(let i=mats.length-1;i>=0;i--)if(mats[i].x<state.dist-8)mats.splice(i,1);
  for(let i=cones.length-1;i>=0;i--)if(cones[i].x<state.dist-8)cones.splice(i,1);
}

/* ── reachable frontier: how far right the deck is walkable from x ──── */
function frontier(x,key){
  let f=x;
  for(let i=0;i<gaps.length;i++){ const g=gaps[i];
    if(g.x1<=f)continue;
    if(g.x0>f)f=g.x0;
    const sup=Math.max(g.x0,Math.min(g[key],g.x1));
    if(sup>f)f=sup;
    if(g[key]>=g.x1-0.001)continue;
    return f; }
  return f+1e6;   /* no unbridged gap ahead: the deck runs on */
}
function frontierP(){ return frontier(state.dist,'lad'); }
function frontierR(){ return frontier(rival.dist,'rlad'); }
function activeGap(){ for(let i=0;i<gaps.length;i++){ const g=gaps[i];
  if(g.x1>state.dist+0.05&&g.x0<=state.dist+0.9)return g; } return null; }
function activeGapFor(x){ for(let i=0;i<gaps.length;i++){ const g=gaps[i];
  if(g.x1>x+0.05&&g.x0<=x+0.9)return g; } return null; }
function atGap(){ const g=activeGap(); return !!g&&g.lad<g.x1-0.001; }

/* ── laying bridge (the whole decision) ─────────────────────────────── */
function buildLay(){
  if(state.phase!=='play')return false;
  const g=activeGap();
  if(!g||g.lad>=g.x1-0.001)return false;
  if(state.material<SEG_COST&&!cheat.LUMBERYARD){ AU.low(); state.flash=Math.max(state.flash,.14); return false; }
  if(!cheat.LUMBERYARD)state.material-=SEG_COST; state.segsLaid++;
  g.lad=Math.min(g.x1,g.lad+SEG_W);
  state.sq=.86; state.shake=Math.max(state.shake,.12);
  const x=sx(g.lad), y=sy(0);
  sparks(6,x,y,P.woodL,170,.4);
  FXP.burst(g.lad,.1,0,8,P.woodL,{speed:3,up:3,size:.09,life:.5});
  AU.lay(state.segsLaid);
  if(g.lad>=g.x1-0.001){ g.bridged=true; state.gapsCrossed++;
    ring(x,y-2*U,P.hivis,10,220); float(x,y-1.6*U,'SPAN LOCKED',P.hivis,15); }
  hud(); return true;
}

/* ── player actions ─────────────────────────────────────────────────── */
function hop(){
  if(state.phase!=='play'||state.paused)return false;
  if(!state.grounded)return false;
  state.vy=HOP_V; state.grounded=false; state.sq=.86;
  AU.hop(); puff(6,RUN_X,sy(0),P.steel,90);
  return true;
}
function setBuild(on){
  if(state.phase!=='play'||state.paused)return false;
  state.buildHold=!!on;
  if(on)buildLay();
  return state.buildHold;
}

/* ── effects ────────────────────────────────────────────────────────── */
function life2(){ return rnd(.25,.5); }
function part(x,y,vx,vy,r,col,life,g){ parts.push({x,y,vx,vy,r,col,life,t:0,g:g||0}); }
function ring(x,y,col,r0,vr){ parts.push({ring:true,x,y,r:r0||8,vr:vr||150,col,life:.5,t:0,g:0}); }
function float(x,y,txt,col,size){ floats.push({x,y,txt,col,size:size||17,life:.9,t:0}); }
function puff(n,x,y,col,spd){ for(let i=0;i<n;i++){
  part(x+rnd(-8,8),y+rnd(-6,2),rnd(-spd,spd*.3),rnd(-spd*.5,-8),rnd(1.5,3.6),col||P.steel,life2(),260);} }
function sparks(n,x,y,col,spd,life){ for(let i=0;i<n;i++){ const a=rnd(0,6.2832),s=rnd(spd*.3,spd);
  part(x,y,Math.cos(a)*s,Math.sin(a)*s-40,rnd(1.2,3),col||P.woodL,rnd(.2,life||.6),420);} }

/* ── world -> screen ────────────────────────────────────────────────── */
/* track -> screen through the 3D camera (the 2D sparks and numbers anchor here) */
const sy=y=>V.project(viewX(),y,0).y;
const sx=z=>V.project(z,0,0).x;
function viewX(){ return state.phase==='menu'?state.menuX:state.dist; }
function hash1(i){ const s=Math.sin(i*127.1+11.7)*43758.5453; return s-Math.floor(s); }
function tiles(period,par,cb){
  const vx=viewX(), off=(vx*par)%period;
  const x0=-RUN_X/U-period, x1=(W-RUN_X)/U+period;
  const start=Math.floor((x0+off)/period)*period-off;
  for(let x=start;x<x1;x+=period){ const i=Math.round((x+off)/period); cb(RUN_X+x*U,i); }
}

  resetTrack();
  state.dist=0; state.menuX=0; state.speed=SPEED0; state.base=SPEED0; state.speedPin=null;
  state.py=0; state.vy=0; state.grounded=true;
  state.material=MAT_START; state.matCollected=0; state.segsLaid=0; state.conesHit=0;
  state.missedMat=0; state.gapsCrossed=0; state.teeter=0; state.stumble=0;
  state.shake=0; state.flash=0; state.sq=1; state.runPh=0; state.deadT=0;

function dailyDone(){ const r=PROG.cfg.dailyReward||60; GK.toast('Daily goal done! +'+r+' coins',{icon:'check'}); GK.confetti(innerWidth/2,innerHeight*.3,40); }
function endRun(finished){
  if(state.phase!=='play')return;
  state.phase='over'; state.paused=false; state.finished=!!finished;
  state.buildHold=false;
  state.finishT=finished?state.time:null;
  if(finished) state.place=(rival.finishT==null||state.time<=rival.finishT)?1:2;
  else state.place=0;
  const sc=scoreNow(), d=Math.floor(state.dist);
  const cheated=codesOn(), sp=SPEC;
  let nb=false, bestShow=REC.best;
  if(sp){ PROG.d.scores=PROG.d.scores||{}; const pb=PROG.d.scores[sp.L]|0; nb=!cheated&&finished&&sc>pb; if(nb)PROG.d.scores[sp.L]=sc; bestShow=Math.max(pb,nb?sc:0); }
  else nb=!cheated&&sc>REC.best&&sc>0;
  const margin=Math.max(0,FINISH_DIST-rival.dist);
  /* a run with codes on never replaces the best score */
  REC.games++; if(!cheated){ if(!sp)REC.best=Math.max(REC.best,sc); REC.bestDist=Math.max(REC.bestDist,d); }
  REC.material+=state.matCollected; REC.segs+=state.segsLaid; REC.dist+=d;
  if(finished){ REC.finishes++; if(state.place===1)REC.wins++; }
  if(!sp)bestShow=REC.best;
  store.set('br_rec',REC);
  let coins=Math.floor(d/40), ns=0, res=[false,false,false];
  if(sp){
    if(finished){ res=[true,state.place===1,state.place===1&&margin>=sp.margin]; ns=res.filter(Boolean).length;
      coins=10+6*sp.L+12*ns+Math.floor(state.matCollected/4);
      PROG.finishLevel(sp.L,ns,coins); if(state.place===1&&PROG.addDaily('wins',1))dailyDone(); }
    else PROG.addCoins(coins);

    $('#ovGoals').innerHTML=goalsHTML(goalsFor(sp),finished?res:[false,false,false]); $('#ovGoals').classList.remove('gk-hidden');
  } else { PROG.addCoins(coins); $('#ovStars').style.display='none'; $('#ovGoals').classList.add('gk-hidden'); if(finished&&state.place===1&&PROG.addDaily('wins',1))dailyDone(); }
  if(PROG.addDaily('gaps',state.gapsCrossed))dailyDone(); if(PROG.addDaily('wood',state.matCollected))dailyDone(); if(PROG.addDaily('runs',1))dailyDone();
  PROG.save();
  /* Was: !finished always printed 'The gap wins', even when the run ended by FALLING into a gap -
     state.reason ('fall') was tracked at :611 and then thrown away, so the player was told the
     wrong thing. Name the actual cause. */
  $('#overKick').textContent = finished
    ? (state.place===1?'First across the span':'The rival beat you')
    : (state.reason==='fall' ? 'You fell through an unplanked gap'
       : state.reason==='quit' ? 'You walked off the job'
       : 'The gap wins');
  $('#overTitle').textContent=finished?(state.place===1?'Bridge Complete':'Second Place')
    :(d<80?'Early Bath':d<260?'Run Over':d<460?'Long Fall':'So Close');
  $('#overHead').className='gk-head '+(finished&&state.place===1?'win':(finished?'':'lose'));
  $('#newbest').style.display=nb?'inline-block':'none';
  $('#ovScore').textContent='0'; GK.countUp($('#ovScore'),sc,800);
  const stat=(i,v,l)=>'<div><b>'+ic(i)+'<span>'+v+'</span></b><span>'+l+'</span></div>';
  $('#ovStat').innerHTML=stat('coin','+'+coins,'Coins')+stat('plank',state.matCollected,'Material')+stat('trophy',bestShow,'Best');
  $('#overStats').innerHTML=statsHTML()+(cheated?'<div class="log"><span>Codes on</span><b>Best not saved</b></div>':'');
  const nextL=sp&&finished; $('#again').innerHTML=(nextL?ic('play')+'NEXT RACE':ic('replay')+'RACE AGAIN'); $('#again').dataset.next=nextL?'1':'';
  show('#s-over'); $('#hud').style.display='none'; updMenuBest(); sdkState('over',sc);
  try{ if(SDK&&sp&&finished)SDK.state({scene:'over',score:sc,level:sp.L,stars:ns}); }catch(e){}
  GK.haptic(finished?[20,40,30]:40);
  if(finished||nb)setTimeout(()=>GK.confetti(innerWidth/2,innerHeight*.35,finished?70:30),300);
  if(coins)setTimeout(()=>GK.fly({x:innerWidth/2,y:innerHeight*.5},$('#ovStat').firstElementChild,Math.min(8,2+Math.floor(coins/8)),'coin'),700);
  PROG.takeNewSkins().forEach((sk,k)=>setTimeout(()=>GK.toast('New bridge style: '+sk.name+'<small>Open Bridges on the menu to use it</small>',{icon:'gift'}),1500+k*900));
}

/* ── update ─────────────────────────────────────────────────────────── */
function updFX(dt){
  for(let i=parts.length-1;i>=0;i--){ const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){ parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.ring)p.r+=p.vr*dt; }
  for(let i=floats.length-1;i>=0;i--){ const f=floats[i]; f.t+=dt;
    if(f.t>=f.life)floats.splice(i,1); }
}
function update(dt,force){
  if(state.frozen&&!force)return;
  state.time+=dt; updFX(dt);
  state.shake=Math.max(0,state.shake-dt*3.2);
  state.flash=Math.max(0,state.flash-dt*2.6);
  if(state.phase==='menu'){ state.menuX+=MENU_SPEED*dt; state.runPh+=dt*9; return; }
  if(state.phase==='over'){ state.deadT+=dt; state.runPh+=dt*2; return; }
  if(state.paused)return;

  sortGaps();
  state.stumble=Math.max(0,state.stumble-dt);
  const base=speedBase(); state.base=base;
  state.speed=base*(state.stumble>0?0.55:1);
  state.runPh+=dt*(7+state.speed*.44);

  /* hop arc */
  if(!state.grounded){ state.vy-=GRAVITY*dt; state.py+=state.vy*dt;
    if(state.py<=0){ state.py=0; state.vy=0; state.grounded=true; state.sq=.86;
      AU.land(); puff(5,RUN_X,sy(0),P.steel,70); } }
  state.sq+=(1-state.sq)*Math.min(1,dt*10);

  /* advance the runner up to the reachable frontier */
  const front=frontierP();
  let nd=state.dist+state.speed*dt;
  if(nd>front)nd=front;
  state.dist=nd;
  planAhead(); cullWorld();
  if(coachT>0&&coachEl.classList.contains('on')){ coachT-=dt; if(coachT<=0)coachHide(); }
  if(coachEl.classList.contains('on')&&state.buildHold)coachHide();
  maybeCoach();

  /* the gap decision: build, teeter, or fall */
  const g=activeGap();
  const atEdge=!!g&&g.lad<g.x1-0.001&&state.dist>=g.lad-0.03;
  const canLay=state.material>=SEG_COST||cheat.LUMBERYARD;
  if(atEdge&&canLay){
    state.autoClock-=dt; state.manClock-=dt;
    if(state.buildHold&&state.manClock<=0){ buildLay(); state.manClock=LAY_CD; }
    else if(state.autoBuild&&state.autoClock<=0){ buildLay(); state.autoClock=LAY_TIME; }
    state.teeter=0;
  } else if(atEdge&&!canLay){
    state.teeter+=dt;
    if(state.teeter>=TEETER&&state.py<=0.25) fallIntoGap();
  } else state.teeter=0;

  /* collect material + hit cones */
  const ptop=state.py+STAND_H;
  for(let i=mats.length-1;i>=0;i--){ const m=mats[i]; if(m.got)continue;
    if(m.x<state.dist-1.2){ m.got=true; state.missedMat++; mats.splice(i,1); continue; }
    if(Math.abs(m.x-state.dist)<PICK_HW+HALF_W&&m.y>state.py+0.1&&m.y<ptop+0.3){
      m.got=true; state.material=Math.min(MAT_MAX,state.material+MAT_GAIN);
      state.matCollected++; const x=sx(m.x),y=sy(m.y);
      ring(x,y,P.hivis,9,200); sparks(9,x,y,P.woodL,220,.55);
      FXP.burst(m.x,m.y,0,12,P.hivis,{speed:3,up:2.5,size:.1,life:.6});
      float(x,y-1.0*U,'+'+MAT_GAIN,P.hivis,15); AU.pop(state.matCollected); hud(); mats.splice(i,1); }
  }
  for(let i=cones.length-1;i>=0;i--){ const c=cones[i]; if(c.hit)continue;
    if(c.x<state.dist-1.5){ c.hit=true; continue; }
    if(Math.abs(c.x-state.dist)<CONE_HW+HALF_W&&state.py<CONE_H-0.05){
      if(cheat.STEELTOES){ c.hit=true; sparks(8,sx(c.x),sy(CONE_H*.6),P.orange,220,.4); continue; }
      c.hit=true; state.conesHit++;
      const cost=Math.min(state.material,coneCost()); state.material-=cost;
      state.stumble=.6; state.shake=Math.max(state.shake,.7); state.sq=.8;
      const x=sx(c.x),y=sy(CONE_H*.6);
      sparks(14,x,y,P.orange,300,.6); sparks(6,x,y,P.paper,220,.4); ring(x,y,P.orange,9,220);
      FXP.burst(c.x,.6,0,16,P.orange,{speed:5,up:4,size:.12,life:.7});
      float(RUN_X,sy(state.py+1.6),cost>0?('-'+cost+' material'):'STUMBLE',P.orange,17);
      AU.hit(); hud(); }
  }

  /* rival builder on the parallel span */
  updateRival(dt);
  if(state.dist>=FINISH_DIST)endRun(true);
  hud();
}
function fallIntoGap(){
  state.grounded=false; state.vy=-2;
  const g=activeGap(); const fx=g?sx(g.lad):RUN_X;
  puff(16,fx,sy(0),P.woodL,120);
  FXP.burst(state.dist+.6,0,0,20,P.woodL,{speed:3,up:2,size:.12,life:.9});
  for(let i=0;i<10;i++)part(fx+rnd(-14,14),sy(0)+rnd(-4,4),rnd(-50,50),rnd(-90,40),
    rnd(2,4),P.grime,life2()*1.4,300);
  state.reason='fall'; endRun(false);
}
function updateRival(dt){
  if(rival.finishT!=null){ rival.speed*=0.9; return; }
  /* rubber-band around the player so the race always feels live */
  let target=(speedBase()*1.02+Math.sin(state.time*1.3+rival.seed)*0.6)*(cheat.SLOWRIVAL?.75:1);
  if(rival.dist<state.dist-10)target*=1.14;
  else if(rival.dist>state.dist+10)target*=0.92;
  rival.speed+=(target-rival.speed)*Math.min(1,dt*2);
  const rf=frontierR();
  let nd=rival.dist+rival.speed*dt;
  if(nd>rf)nd=rf;
  rival.dist=nd;
  /* the rival builds his own mirror span, at a fixed rate */
  const rg=activeGapFor(rival.dist);
  if(rg&&rg.rlad<rg.x1-0.001&&rival.dist>=rg.rlad-0.03){
    rival.layClock-=dt;
    if(rival.layClock<=0){ rg.rlad=Math.min(rg.x1,rg.rlad+SEG_W); rival.layClock=RIVAL_LAY;
      if(rg.rlad>=rg.x1-0.001)rg.rbridged=true; }
  }
  if(rival.dist>=FINISH_DIST){ rival.finishT=state.time; }
  /* taunts + "ahead" pressure */
  const lead=rival.dist-state.dist;
  if(lead>6){ state.tauntT-=dt;
    if(state.tauntT<=0){ state.tauntT=rnd(3,5); AU.taunt();
      float(sx(rival.dist),RY-2.4*U,(rnd(0,1)<.5?'catch up!':'too slow!'),P.woodL,15); } }
  else state.tauntT=Math.max(state.tauntT,1.2);
  state.aheadT=(state.dist>rival.dist+8)?Math.min(1,state.aheadT+dt*2):Math.max(0,state.aheadT-dt*2);
}

/* ── render ─────────────────────────────────────────────────────────── */

  loadFrames('rival','sprint',10),loadFrames('rival','jump',1),loadFrames('rival','idle',1),

  RIVAL=new Actor({sprint:rs,jump:rj,idle:ri},{scale:CHAR_S*.95,outline:.012}); V.scene.add(RIVAL.root);

  PLANKS=new Props(V.scene,m[1],120,{receive:true,outline:.01});
  PICK=new Props(V.scene,m[1],30,{outline:.012}); CARRYP=new Props(V.scene,m[1],48);

function hash1b(i){ const s=Math.sin(i*127.1+11.7)*43758.5453; return s-Math.floor(s); }
const cT=new THREE.Color();
/* ground stretches between gaps, on a world-fixed 2 m tile grid so nothing swims */
function deckRange(x0,x1,lane,sc){
  for(let k=Math.floor(x0/TILE);k*TILE<x1;k++){ const a=Math.max(x0,k*TILE), b=Math.min(x1,(k+1)*TILE); if(b-a<.02)continue;
    DECK.add(mat((a+b)/2,-1.35,lane,0,0,0,[(b-a)/2.08,1.35,sc]),((k+(lane?1:0))%2)?cT.set('#ffffff'):cT.set('#efe4cc')); } }
let lastT=0;
function render(){ if(calm()){ state.shake=0; state.flash=0; }
  const sky=skyNow(); state.frames++;
  const now=performance.now()/1000, rdt=Math.min(.05,lastT?now-lastT:.016); lastT=now;
  SKY3.set(sky.top,sky.bot,sky.haze,mixC(sky.bot,sky.haze)); SKY3.u.stars.value=sky.star;
  LIGHT.hemi.intensity=lerp(.85,.5,sky.c/4); LIGHT.sun.intensity=lerp(3.0,1.5,sky.c/4);
  const vx=viewX();
  /* camera: in front of the spans, trailing the runner, framing the next gap */
  /* wide screens: a 3/4 side view down the race; tall phones: swing round behind the runner */
  const pt=clamp((1.25-V.camera.aspect)/.7,0,1), sh=state.shake*state.shake;
  V.camera.position.set(vx+lerp(-2.6,-8.5,pt)+(Math.random()-.5)*sh*.5,lerp(6.4,9,pt)+(Math.random()-.5)*sh*.4,lerp(11.5,1.2,pt));
  V.camera.lookAt(vx+lerp(4.2,4,pt),.2,lerp(RIVAL_Z*.35,RIVAL_Z*.45,pt));
  LIGHT.follow(vx+3,0,RIVAL_Z/2);
  SKY3.update(now);
  sea.position.x=vx; water.offset.set((vx/8.6)%1+now*.01,now*.02%1);
  /* project() is ready now: refresh the screen anchors the 2D effects use */
  const p0=V.project(vx,0,0); RUN_X=p0.x; GY=p0.y; U=p0.s; RY=V.project(rival.dist,0,RIVAL_Z).y;
  if(!BUILDER){ V.render(); return; }
  /* the deck on both spans, with gaps cut out, and the planks laid over them */
  DECK.begin(); PLANKS.begin(); let ne=0;
  const a0=vx-14, a1=vx+AHEAD+6;
  for(const lane of [0,RIVAL_Z]){ let from=a0;
    for(const g of gaps){ if(g.x1<a0||g.x0>a1)continue;
      if(g.x0>from)deckRange(from,g.x0,lane,lane?1:1.1);
      from=Math.max(from,g.x1);
      const lad=lane?g.rlad:g.lad;
      for(let x=g.x0;x<lad-.01;x+=SEG_W){ const b=Math.min(lad,x+SEG_W);
        PLANKS.add(mat((x+b)/2,-.22,lane,0,0,Math.sin(x*3)*.02,[(b-x)*.96,1.1,lane?1.9:2.2]),plankTint[Math.round(x/SEG_W)%2]); }
      if(!lane&&ne<38){ for(const ex of [g.x0,g.x1]){ edges.setMatrixAt(ne++,mat(ex+(ex===g.x0?-.25:.25),.012,0,0,-Math.PI/2,0,[.5,2.3,1])); } } }
    if(from<a1)deckRange(from,a1,lane,1.1); }
  edges.count=ne; edges.instanceMatrix.needsUpdate=true;
  DECK.end(); PLANKS.end();
  /* floating planks to grab (hover + spin) and cones */

  for(const m of mats){ if(m.got||m.x<a0||m.x>a1)continue; const y=m.y+Math.sin(state.time*3+m.seed)*.06;
    PICK.add(mat(m.x,y-.1,0,state.time*1.6+m.seed,0,.15*Math.sin(state.time*1.6+m.seed),[.9,1.4,.36]),cT.set('#ffd9a0'));
    if(ng<30)glow.setMatrixAt(ng++,mat(m.x,.02,0,0,-Math.PI/2,0,1+.12*Math.sin(state.time*4+m.seed))); }
  glow.count=ng; glow.instanceMatrix.needsUpdate=true; PICK.end();

  FLAGS.begin(); FLAGS.add(mat(FINISH_DIST,0,.9,-.4,0,0,4)); FLAGS.add(mat(FINISH_DIST,0,RIVAL_Z-.9,-.4,0,0,4)); FLAGS.end();
  /* islands with trees beyond the rival span, rocks in front */
  TREES.begin(); PINES.begin(); ROCKS.begin();
  const z0=Math.floor((vx-20)/7), z1=Math.floor((vx+AHEAD+10)/7);
  for(let i=z0;i<=z1;i+=(V.low?2:1)){ const h=hash1b(i), x=i*7+h*4;
    DECK.add(mat(x,-2.3,RIVAL_Z-6-h*6,h,0,0,[1.4+h,1.1,1.4+h]),cT.set('#ffffff'));
    (h>.5?PINES:TREES).add(mat(x,-1.2,RIVAL_Z-6-h*6,h*9,0,0,1.6+h*.6));
    if(h<.35)ROCKS.add(mat(x+2,-2.3,4+h*3,h*9,0,0,2+h)); }
  DECK.end(); TREES.end(); PINES.end(); ROCKS.end();

  const rStop=!rb&&(()=>{ const g=activeGapFor(rival.dist); return g&&g.rlad<g.x1-.001&&rival.dist>=g.rlad-.05; })();
  RIVAL.pose(rb||rStop?'idle':'sprint',(state.runPh+1.4)/6.2832);

  CARRYP.begin();
  const nm=Math.min(state.material,22);
  for(let i=0;i<nm;i++)CARRYP.add(mat(vx-.34,state.py-drop+.55+i*.14,0,Math.PI/2,0,Math.sin(state.runPh+i*.3)*.02*i,[.62,.7,.36]),cT.set(i%2?'#ffd9a0':'#ffffff'));
  const rn=rb?0:6+Math.round(3+3*Math.sin(state.time*.4+rival.seed));
  for(let i=0;i<rn;i++)CARRYP.add(mat(rival.dist-.33,.55+i*.14,RIVAL_Z,Math.PI/2,0,0,[.6,.7,.34]),cT.set(i%2?'#f3b089':'#ffd6c0'));

  drawSpeedLines(); drawFX();

  drawVignette();

function mixC(a,b){ return mix(a,b,.5); }

let last=0;
/* ── music bed ───────────────────────────────────────────────────
   One plain <audio> loop (audio/bed.mp3). Built lazily on the first real user
   gesture, so nothing is fetched or played before then. Driven from the game
   phase: it starts with play and stops on pause / menu / over, and the same
   Sound toggle that mutes the SFX (AU.on) mutes the bed too. */
const BED=(function(){
  let el=null,on=false,dead=false,gestured=false;
  function sync(){
    const want=!!(AU.on&&gestured&&!dead&&state.phase==='play'&&!state.paused);
    if(want===on)return;
    on=want;
    try{
      if(want){
        if(!el){ el=new Audio(); el.preload='auto'; el.loop=true; el.volume=0.26;
          el.addEventListener('error',function(){dead=true;el=null;},{once:true});
          el.src='audio/bed.mp3'; }
        const pr=el.play(); if(pr&&pr.catch)pr.catch(function(){});
      } else if(el){ el.pause(); }
    }catch(e){}
  }
  function gesture(){ gestured=true; sync(); }
  addEventListener('pointerdown',gesture,{capture:true,passive:true});
  addEventListener('keydown',gesture,{capture:true,passive:true});
  return { sync:sync, el:function(){return el;}, now:function(){return on;},
    state:function(){ return {on:on,gestured:gestured,dead:dead,
      src:el?el.getAttribute('src'):null,volume:el?el.volume:null,
      paused:el?el.paused:null,currentTime:el?+el.currentTime.toFixed(2):null,
      readyState:el?el.readyState:null}; } };
})();
window.__BED=BED;
function tick(ts){
  requestAnimationFrame(tick);
  BED.sync();
  const dt=Math.min(((ts-last)/1000)||0,.05); last=ts;
  update(dt,false);
  render();
}

/* ── share card ──────────────────────────────────────────────────────
   Additive: composites a plain 880x520 PNG from the SAME live numbers the
   over screen is already showing, so the card can never disagree with the
   run that produced it. Canvas 2D + toBlob only — no library, no network,
   no external font, no new localStorage key. */
var SC_CFG={title:'BRIDGE RUSH',sub:'Ironline Bridge Co. \u00b7 lay planks, beat the rival',bg:'#1f1810',panel:'#2a2015',
  accent:'#ffd21e',ink:'#fbf3e4',dim:'#b6a891',gold:'#ffd21e',file:'bridgerush'};
function scFont(g,weight,size,text,maxW,family){
  g.font=weight+' '+size+'px '+family;
  while(size>8&&g.measureText(text).width>maxW){ size-=1; g.font=weight+' '+size+'px '+family; }
  return size;
}
function scStatRows(){
  var out=[],ns=document.querySelectorAll('#overStats .log');
  for(var i=0;i<ns.length;i++){
    var s=ns[i].querySelector('span'),b=ns[i].querySelector('b');
    if(s&&b)out.push([s.textContent.trim(),b.textContent.trim()]);
  }
  return out;
}
function shareCard(){
  try{
    var W=880,H=520,c=document.createElement('canvas');c.width=W;c.height=H;
    var g=c.getContext('2d'),C=SC_CFG;
    var DF="'Arial Black','Archivo Black',Impact,sans-serif";
    var TX="'Segoe UI',-apple-system,Roboto,Arial,sans-serif";
    var MO="ui-monospace,Consolas,'Courier New',monospace";
    var elK=document.getElementById('overKick'),elT=document.getElementById('overTitle');
    var kick=(elK&&elK.textContent||'').replace(/\s+/g,' ').trim()||'Run over';
    var ttl=(elT&&elT.textContent||'').replace(/\s+/g,' ').trim()||'Run Over';
    var nbEl=document.getElementById('newbest');
    var nb=!!nbEl&&getComputedStyle(nbEl).display!=='none';
    var rows=scStatRows();

    g.fillStyle=C.bg; g.fillRect(0,0,W,H);
    g.fillStyle=C.panel; g.fillRect(0,0,W,104);
    g.fillStyle=C.accent; g.fillRect(0,0,10,H);
    g.fillStyle=C.accent; g.fillRect(0,104,W,4);

    scFont(g,800,34,C.title,W-320,DF);
    g.fillStyle=C.accent; g.fillText(C.title,42,54);
    scFont(g,600,15,C.sub,W-320,TX);
    g.fillStyle=C.dim; g.fillText(C.sub,42,84);
    g.textAlign='right';
    g.font='700 13px '+DF; g.fillStyle=C.dim; g.fillText('SHARE CARD',W-42,54);
    g.textAlign='left';

    if(nb){
      g.textAlign='right';
      scFont(g,800,18,'\u2605 NEW BEST \u2605',240,DF);
      g.fillStyle=C.gold; g.fillText('\u2605 NEW BEST \u2605',W-42,166);
      g.textAlign='left';
    }
    scFont(g,700,20,kick,nb?540:760,DF);
    g.fillStyle=C.accent; g.fillText(kick,42,166);

    scFont(g,800,52,ttl,W-84,DF);
    g.fillStyle=C.ink; g.fillText(ttl,42,240);

    var n=Math.min(rows.length,8);
    for(var i=0;i<n;i++){
      var col=i%2, rw=(i-col)/2;
      var x=42+col*418, y=300+rw*48;
      g.font='700 12px '+MO; g.fillStyle=C.dim;
      g.fillText(String(rows[i][0]).toUpperCase(),x,y);
      scFont(g,800,22,String(rows[i][1]),386,MO);
      g.fillStyle=C.ink; g.fillText(String(rows[i][1]),x,y+24);
    }

    g.fillStyle=C.panel; g.fillRect(0,H-44,W,44);
    g.fillStyle=C.accent; g.fillRect(0,H-44,W,3);
    g.font='600 13px '+TX; g.fillStyle=C.dim;
    g.fillText(new Date().toLocaleDateString(),42,H-16);
    g.textAlign='right'; g.font='700 13px '+DF; g.fillStyle=C.accent;
    g.fillText('PLAYABLES \u00b7 '+C.title,W-42,H-16);
    g.textAlign='left';

    c.toBlob(function(b){
      if(!b)return;
      var u=URL.createObjectURL(b),a=document.createElement('a');
      a.href=u; a.download=C.file+'-card.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){URL.revokeObjectURL(u);},2000);
    },'image/png');
  }catch(e){}
}
window.__shareCard=shareCard;
(function(){ var b=document.getElementById('btnShare');
  if(b)b.addEventListener('click',shareCard); })();

window.__bridge_debug={
  state(){ return {phase:state.phase,paused:state.paused,frozen:state.frozen,frames:state.frames,
    score:scoreNow(),dist:Math.floor(state.dist),distExact:+state.dist.toFixed(2),
    speed:+state.speed.toFixed(2),base:+state.base.toFixed(2),
    material:state.material,matCollected:state.matCollected,segsLaid:state.segsLaid,
    cones:state.conesHit,hits:state.conesHit,missed:state.missedMat,gapsCrossed:state.gapsCrossed,
    grounded:state.grounded,air:+state.py.toFixed(3),py:+state.py.toFixed(3),
    teeter:+state.teeter.toFixed(2),building:state.buildHold,autoBuild:state.autoBuild,
    blocked:atGap()&&state.dist>=frontierP()-0.03,
    finished:state.finished,place:state.place,reason:state.reason,
    leg:legIdx()+1,legName:legName(),
    rival:{dist:+rival.dist.toFixed(2),speed:+rival.speed.toFixed(2),finishT:rival.finishT,rlad:(function(){const g=activeGapFor(rival.dist);return g?+g.rlad.toFixed(2):0;})()},
    gap:(function(){const g=activeGap();return g?{x0:+g.x0.toFixed(2),x1:+g.x1.toFixed(2),lad:+g.lad.toFixed(2),bridged:g.bridged}:null;})(),
    gaps:gaps.length,mats:mats.length,conesN:cones.length,
    rec:JSON.parse(JSON.stringify(REC)),snd:AU.on}; },
  start(){ MODE='classic'; startRun(); return this.state(); },
  startLevel(l){ MODE='level'; LEVEL=Math.max(1,Math.min(PROG.d.level,+l||1)); startRun(); return this.state(); },
  level(){ return {mode:MODE,level:LEVEL,spec:SPEC,prog:JSON.parse(JSON.stringify(PROG.d))}; },
  menu(){ toMenu(); return this.state(); },
  wipe(){ try{localStorage.removeItem('br_rec')}catch(e){}
    REC={games:0,best:0,bestDist:0,material:0,segs:0,finishes:0,wins:0,dist:0}; updMenuBest(); return this.state(); },
  pause(){ togglePause(true); return this.state(); },
  resume(){ togglePause(false); return this.state(); },
  end(){ endRun(false); return this.state(); },
  finish(){ endRun(true); return this.state(); },
  freeze(on){ state.frozen=(on!==false); return state.frozen; },
  live(){ state.frozen=false; return true; },
  setSpawner(on){ state.spawner=!!on; if(!on)state.nextGapAt=1e9;
    else { state.nextGapAt=state.dist+14; state.prevGroundFrom=state.dist; } return state.spawner; },
  autoBuild(on){ state.autoBuild=(on!==false); return state.autoBuild; },
  clearTrack(){ gaps.length=0; mats.length=0; cones.length=0; parts.length=0; floats.length=0;
    state.nextGapAt=1e9; return true; },
  resetTrack(){ resetTrack(); return true; },
  setDist(d){ state.dist=clamp(+d||0,0,FINISH_DIST-0.01); state.prevGroundFrom=state.dist;
    state.nextGapAt=state.dist+14; hud(); return +state.dist.toFixed(2); },
  setMaterial(v){ state.material=clamp(Math.round(+v||0),0,MAT_MAX); hud(); return state.material; },
  setSpeed(v){ state.speedPin=(v===null||v===undefined)?null:Math.max(0,+v||0); return state.speedPin; },
  spawnMaterialAt(ahead,y){ if(state.phase!=='play')return null;
    const x=state.dist+(ahead===undefined?6:+ahead);
    const m={x,y:(y===undefined||y===null)?PICK_LOW:(+y),got:false,seed:rnd(0,6.3)};
    mats.push(m); return +m.x.toFixed(2); },
  forceGap(ahead,segs){ if(state.phase!=='play')return null;
    const s=clamp(Math.round(segs||4),1,12);
    const at=Math.max(1,state.dist+(ahead===undefined?6:+ahead));
    for(let i=gaps.length-1;i>=0;i--)if(gaps[i].x0>=at-0.001)gaps.splice(i,1);
    for(let i=0;i<gaps.length;i++){ const g=gaps[i]; if(g.x1>at){ g.x1=at;
      g.lad=Math.min(g.lad,at); g.rlad=Math.min(g.rlad,at); } }
    const g=addGapSeg(at,s); sortGaps();
    state.nextGapAt=g.x1+14; state.prevGroundFrom=Math.min(state.prevGroundFrom,at);
    return +(g.x1-g.x0).toFixed(2); },
  layBridge(){ return buildLay(); },
  setRivalX(x){ rival.dist=clamp(+x||0,0,FINISH_DIST); return +rival.dist.toFixed(2); },
  setRival(ahead){ rival.dist=clamp(state.dist+(+ahead||0),0,FINISH_DIST); return +rival.dist.toFixed(2); },
  hop(){ return hop(); },
  build(on){ return setBuild(on===false?false:true); },
  advance(sec){ let t=clamp(+sec||0,0,60), st=1/60, guard=0;
    while(t>1e-4&&guard++<4000&&state.phase==='play'){ update(Math.min(st,t),true); t-=st; }
    render(); return this.state(); }
};

/* ── arcade hookup ── */
function syncGfx(){ const b=document.getElementById('gfxBtn'); if(b)b.textContent='Graphics: '+(GFX_LOW?'Low':'High'); }
document.getElementById('gfxBtn').onclick=()=>{ GFX_LOW=!GFX_LOW; try{ localStorage.setItem('br_gfx',GFX_LOW?'low':'high'); }catch(e){} syncGfx(); resize(); AU.ui&&AU.ui(); };
syncGfx();
function hintNow(){
  if(state.phase!=='play')return 'Tap anywhere to start. Hold (or Down) to lay planks over gaps; tap (or Space) hops cones.';
  const g=activeGap(), gapIn=g?g.x0-state.dist:99;
  if(g&&gapIn<14&&state.material<Math.ceil((g.x1-g.lad)/SEG_W))return 'Not enough material for the next gap: grab the floating planks before you reach the edge.';
  if(g&&gapIn<10)return 'Gap ahead: hold (or Down) to lay planks faster than the auto-build.';
  if(rival.dist>state.dist+4)return 'The rival is ahead: hop cones so you do not stumble, and build fast at each gap.';
  return 'Keep a few planks spare: every cone you run into knocks material loose.';
}
function replayTutorial(){ hintSeen=false; store.set('br_hint',false); startRun(); }
function applyCode(code){ const c=codeOn(code); if(!c)return {ok:false};
  if(c==='LUMBERYARD'){ state.material=Math.max(state.material,SEG_COST); hud(); }
  return {ok:true,message:CODES[c]}; }
if(SDK){ try{ window.ArcadeSDK.init({
  pauseKeys:'p+esc', pauseButton:'br',
  onPause(){ state.paused=true; }, onResume(){ state.paused=false; },
  onRestart(){ startRun(); }, onExit(){ toMenu(); },
  onTutorial:replayTutorial, onHint:hintNow, onCheat:applyCode
}); }catch(e){} }

/* ── boot ───────────────────────────────────────────────────────────── */
applySkin(); resize(); updSnd(); paintMenu(); toMenu(); requestAnimationFrame(tick);
})();
