name: Mobile offline regression
on:
  push:
    branches: [main, master, 'offline/**']
  pull_request:
  workflow_dispatch:
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/build-mobile-offline.py --check
      - run: node tools/check-mobile-offline.cjs && node --test qa/offline/worker.test.cjs
      - run: npm ci --prefix qa/offline --ignore-scripts
      - run: cd qa/offline && npx playwright install --with-deps ${{ matrix.engine }}
      - run: node tools/test-mobile-offline.cjs
        env:
          ENGINE: ${{ matrix.engine }}
          NODE_PATH: ./qa/offline/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-offline-${{ matrix.engine }}
          path: qa/offline-results/
